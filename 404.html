<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e;
    --gold-light: #e8d5a3;
    --white: #f5f0eb;
    --grey: #8a8680;
    --dark: #0a0a0a;
    --dark-2: #111111;
  }
  html, body {
    height: 100%;
  }
  body {
    background: var(--dark) url('images/Portraits__Kardelen__DSC_3802-1.webp') center 22% / cover no-repeat;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
    text-align: center;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(to top, rgba(10,10,10,0.92), rgba(10,10,10,0.72) 45%, rgba(10,10,10,0.55));
    z-index: 0;
  }
  .wrap { max-width: 560px; position: relative; z-index: 1; }
  .logo-link {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-decoration: none;
    font-weight: 400;
    margin-bottom: 40px;
  }
  .logo-link:hover { color: var(--gold-light); }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(64px, 14vw, 128px);
    line-height: 1;
    color: var(--white);
    margin-bottom: 16px;
  }
  p.lede {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 3vw, 26px);
    font-style: italic;
    color: var(--grey);
    margin-bottom: 40px;
    line-height: 1.5;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }
  .btn {
    display: inline-block;
    padding: 14px 32px;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: opacity 0.25s ease, background 0.25s ease, color 0.25s ease;
  }
  .btn-primary {
    background: linear-gradient(to right, var(--gold), var(--gold-light));
    color: var(--dark);
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary {
    border: 1px solid rgba(232,213,163,0.4);
    color: var(--white);
    background: transparent;
  }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold-light); }
  a:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
