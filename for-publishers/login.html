<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | For Publishers | Photoczaro</title>
<meta name="description" content="Log in to your Photoczaro publisher account to browse shoot selects and request images for your publication.">
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css?v=2">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<style id="a11y-css">:focus-visible{outline:2px solid #c9a96e;outline-offset:2px}:focus:not(:focus-visible){outline:none}.skip-link{position:absolute;top:-100px;left:16px;z-index:100000;background:#c9a96e;color:#0a0a0a;padding:12px 20px;border-radius:4px;font-size:13px;font-weight:500;text-decoration:none;transition:top 0.2s ease}.skip-link:focus{top:16px}.menu-close{position:fixed;z-index:101;width:44px;height:44px;padding:0;margin:0;background:transparent;border:0;border-radius:50%;cursor:pointer;display:none}.mobile-menu-overlay.open .menu-close{display:block}.menu-close:focus-visible{outline:2px solid #c9a96e;outline-offset:2px}.lightbox:not(.open){visibility:hidden}.lightbox.open{visibility:visible}:root{--grey:#a8a39b}nav .nav-links a,nav .nav-more-btn,nav .lang-switch-btn-nav{color:rgba(245,240,235,0.92);text-shadow:0 1px 4px rgba(0,0,0,0.75)}nav:not(.scrolled)::before{content:"";position:absolute;inset:0 0 -24px 0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(10,8,6,0.72),rgba(10,8,6,0))}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important}}@media (prefers-reduced-motion:reduce),(hover:none){html,body,a,button,.cta-btn{cursor:auto !important}.cursor,.cursor-ring{display:none !important}}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.lang-switch-menu a{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}:where(img[width][height]){height:auto}</style>
</head>
<body>

<header class="pub-header">
  <a href="/" class="pub-logo">Photoczaro <span>/ Publishers</span></a>
  <nav><a href="signup" class="pub-btn pub-btn-solid pub-btn-sm">Register</a></nav>
</header>

<main>
  <div class="pub-eyebrow">Publisher Access</div>
  <h1 class="pub-title">Log in</h1>

  <div class="pub-msg" id="msg"></div>

  <form class="pub-form" id="login-form">
    <div class="pub-field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="pub-field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="pub-btn pub-btn-solid" id="submit-btn">Log In</button>
  </form>

  <p class="pub-note">Not registered yet? <a href="signup">Create an account</a></p>
</main>

<footer class="pub-footer">&copy; Photoczaro. Access to this gallery is by approval only.</footer>

<script>
const form = document.getElementById('login-form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'pub-msg';
  btn.disabled = true;
  btn.textContent = 'Logging in…';

  try {
    const res = await fetch('/api/publishers-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.error || 'Something went wrong.';
      msg.className = 'pub-msg error show';
      btn.disabled = false;
      btn.textContent = 'Log In';
      return;
    }

    window.location.href = 'gallery';
  } catch {
    msg.textContent = 'Network error. Please try again.';
    msg.className = 'pub-msg error show';
    btn.disabled = false;
    btn.textContent = 'Log In';
  }
});
</script>

</body>
</html>
