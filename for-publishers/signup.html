<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | For Publishers | Photoczaro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css?v=2">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
</head>
<body>

<header class="pub-header">
  <a href="/" class="pub-logo">Photoczaro <span>/ Publishers</span></a>
  <nav><a href="login" class="pub-btn pub-btn-sm">Log In</a></nav>
</header>

<main>
  <div class="pub-eyebrow">Register</div>
  <h1 class="pub-title">Create your publisher account</h1>
  <p class="pub-lede">Every account is reviewed by hand before it's activated &mdash; you'll get access once it's approved.</p>

  <div class="pub-msg" id="msg"></div>

  <form class="pub-form" id="signup-form">
    <div class="pub-field">
      <label for="name">Your Name</label>
      <input type="text" id="name" required autocomplete="name">
    </div>
    <div class="pub-field">
      <label for="magazine">Magazine / Publication</label>
      <input type="text" id="magazine" required autocomplete="organization">
    </div>
    <div class="pub-field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="pub-field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="pub-btn pub-btn-solid" id="submit-btn">Register</button>
  </form>

  <p class="pub-note">Already have an account? <a href="login">Log in</a></p>
</main>

<footer class="pub-footer">&copy; Photoczaro. Access to this gallery is by approval only.</footer>

<script>
const form = document.getElementById('signup-form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'pub-msg';
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const res = await fetch('/api/publishers-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        magazine: document.getElementById('magazine').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.error || 'Something went wrong.';
      msg.className = 'pub-msg error show';
      btn.disabled = false;
      btn.textContent = 'Register';
      return;
    }

    window.location.href = 'pending';
  } catch {
    msg.textContent = 'Network error. Please try again.';
    msg.className = 'pub-msg error show';
    btn.disabled = false;
    btn.textContent = 'Register';
  }
});
</script>

</body>
</html>
